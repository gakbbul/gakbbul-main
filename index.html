<!DOCTYPE html>
<html lang="ko" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GAKBBUL - Link Hub Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Babel Standalone for in-browser compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              slate: {
                850: '#152033',
                950: '#020617',
              }
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #020617;
        color: #f8fafc;
        overflow-x: hidden;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #020617;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #334155;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 3px;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.344.0"
  }
}
</script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import React, { useState, useEffect, useCallback } from 'react';
      import ReactDOM from 'react-dom/client';
      import { 
        ExternalLink, 
        Globe, 
        Search, 
        Sparkles, 
        RefreshCw,
        Tag,
        FileSpreadsheet,
        AlertCircle
      } from 'lucide-react';

      // --- SHEET STORAGE CONSTANTS ---
      const DEFAULT_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1LMLclxIx5JJwlGwh1hyFYtvRUG_m5A-2HvjnwvQsjbY/edit?usp=sharing';
      const SHEET_STORAGE_KEY = 'gakbbul_sheet_url';
      const CACHE_STORAGE_KEY = 'gakbbul_cached_sites';

      const getSavedSheetUrl = () => {
        const saved = localStorage.getItem(SHEET_STORAGE_KEY);
        return saved && saved.trim() ? saved.trim() : DEFAULT_SHEET_URL;
      };

      const saveSheetUrl = (url) => {
        localStorage.setItem(SHEET_STORAGE_KEY, (url || '').trim());
      };

      const getCachedSites = () => {
        try {
          const cached = localStorage.getItem(CACHE_STORAGE_KEY);
          return cached ? JSON.parse(cached) : [];
        } catch (e) {
          return [];
        }
      };

      const cacheSites = (sites) => {
        try {
          localStorage.setItem(CACHE_STORAGE_KEY, JSON.stringify(sites));
        } catch (e) {}
      };

      // --- SHEET CONVERTER & CSV PARSER ---
      const convertToCsvUrl = (url) => {
        const trimmed = (url || '').trim();
        if (!trimmed) return '';

        if (trimmed.includes('format=csv') || trimmed.includes('output=csv')) {
          return trimmed;
        }

        if (trimmed.includes('/pubhtml')) {
          return trimmed.replace('/pubhtml', '/pub?output=csv');
        }

        const docIdMatch = trimmed.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
        if (docIdMatch && docIdMatch[1]) {
          const docId = docIdMatch[1];
          const gidMatch = trimmed.match(/[#&?]gid=([0-9]+)/);
          const gidParam = gidMatch ? `&gid=${gidMatch[1]}` : '';
          return `https://docs.google.com/spreadsheets/d/${docId}/gviz/tq?tqx=out:csv${gidParam}`;
        }

        return trimmed;
      };

      const parseCsv = (csvText) => {
        const rows = [];
        let currentRow = [];
        let currentField = '';
        let insideQuotes = false;

        for (let i = 0; i < csvText.length; i++) {
          const char = csvText[i];
          const nextChar = csvText[i + 1];

          if (insideQuotes) {
            if (char === '"' && nextChar === '"') {
              currentField += '"';
              i++;
            } else if (char === '"') {
              insideQuotes = false;
            } else {
              currentField += char;
            }
          } else {
            if (char === '"') {
              insideQuotes = true;
            } else if (char === ',') {
              currentRow.push(currentField.trim());
              currentField = '';
            } else if (char === '\r') {
              if (nextChar === '\n') i++;
              currentRow.push(currentField.trim());
              if (currentRow.some(c => c.length > 0)) {
                rows.push(currentRow);
              }
              currentRow = [];
              currentField = '';
            } else if (char === '\n') {
              currentRow.push(currentField.trim());
              if (currentRow.some(c => c.length > 0)) {
                rows.push(currentRow);
              }
              currentRow = [];
              currentField = '';
            } else {
              currentField += char;
            }
          }
        }

        if (currentField || currentRow.length > 0) {
          currentRow.push(currentField.trim());
          if (currentRow.some(c => c.length > 0)) {
            rows.push(currentRow);
          }
        }

        return rows;
      };

      const extractHostname = (url) => {
        try {
          const formatted = url.startsWith('http://') || url.startsWith('https://') 
            ? url 
            : `https://${url}`;
          const parsed = new URL(formatted);
          return parsed.hostname.replace(/^www\./, '');
        } catch {
          return url || 'LINK';
        }
      };

      const parseRowsToSites = (rows) => {
        if (!rows || rows.length === 0) return [];

        let startIndex = 0;
        let titleCol = 0;
        let subtitleCol = 1;
        let descCol = 2;
        let urlCol = 3;

        const firstRow = rows[0].map(c => (c || '').toLowerCase().trim());
        const hasHeader = firstRow.some(c => 
          c.includes('제목') || c.includes('title') || 
          c.includes('설명') || c.includes('desc') || 
          c.includes('주소') || c.includes('url') || c.includes('link') || c.includes('부제목') || c.includes('sub')
        );

        if (hasHeader) {
          startIndex = 1;
          firstRow.forEach((col, idx) => {
            if (col.includes('부제목') || col.includes('subtitle') || col.includes('소제목') || col.includes('태그')) {
              subtitleCol = idx;
            } else if (col.includes('제목') || col.includes('title') || col.includes('이름')) {
              titleCol = idx;
            } else if (col.includes('설명') || col.includes('desc') || col.includes('info') || col.includes('내용')) {
              descCol = idx;
            } else if (col.includes('주소') || col.includes('url') || col.includes('link') || col.includes('링크') || col.includes('사이트')) {
              urlCol = idx;
            }
          });
        }

        const sites = [];
        for (let i = startIndex; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length === 0) continue;

          const title = (row[titleCol] || '').trim();
          const subtitle = (row[subtitleCol] || '').trim();
          const description = (row[descCol] || '').trim();
          const rawUrl = (row[urlCol] || '').trim();

          if (!title && !rawUrl) continue;

          const hostname = extractHostname(rawUrl || title);

          sites.push({
            id: `site-${i}-${Date.now()}`,
            title: title || hostname,
            subtitle: subtitle || undefined,
            description: description || '등록된 설명이 없습니다.',
            url: rawUrl,
            name: hostname,
            createdAt: Date.now() - i * 1000,
          });
        }

        return sites;
      };

      const fetchSitesFromGoogleSheet = async (sheetUrl) => {
        const csvUrl = convertToCsvUrl(sheetUrl);
        if (!csvUrl) {
          throw new Error('유효한 구글 스프레드시트 URL이 아닙니다.');
        }

        const response = await fetch(csvUrl, {
          method: 'GET',
          headers: {
            'Accept': 'text/csv, text/plain, */*'
          }
        });

        if (!response.ok) {
          throw new Error(`스프레드시트를 불러오지 못했습니다 (상태: ${response.status}). 스프레드시트 공유 권한(링크가 있는 모든 사용자 - 뷰어)을 확인해주세요.`);
        }

        const csvText = await response.text();
        if (csvText.includes('<!DOCTYPE html>') || csvText.includes('<html')) {
          throw new Error('스프레드시트에 접근할 수 없습니다. 공유 설정을 "링크가 있는 모든 사용자 - 뷰어"로 변경해주세요.');
        }

        const rows = parseCsv(csvText);
        const sites = parseRowsToSites(rows);

        if (sites.length > 0) {
          cacheSites(sites);
        }

        return sites;
      };

      // --- COMPONENTS: SiteCard ---
      const SiteCard = ({ site }) => {
        const handleCardClick = () => {
          if (!site.url) return;
          const targetUrl = site.url.startsWith('http') ? site.url : `https://${site.url}`;
          window.open(targetUrl, '_blank', 'noopener,noreferrer');
        };

        const isDev = site.subtitle ? site.subtitle.includes('개발중') : false;

        return (
          <div 
            onClick={handleCardClick}
            className="group relative flex flex-col justify-between p-5 bg-slate-900/60 backdrop-blur-sm border border-slate-800 rounded-2xl cursor-pointer hover:border-blue-500/50 hover:bg-slate-900/90 hover:shadow-xl hover:shadow-blue-500/10 transition-all duration-300 overflow-hidden min-h-[180px]"
          >
            <div className={`absolute top-0 right-0 w-28 h-28 rounded-full blur-2xl -mr-10 -mt-10 pointer-events-none transition-all duration-500 ${isDev ? 'bg-red-500/5 group-hover:bg-red-500/15' : 'bg-blue-500/5 group-hover:bg-blue-500/15'}`} />

            <div className="flex flex-col h-full justify-between">
              <div>
                <div className="flex items-center justify-between mb-3 gap-2">
                  <div className="flex items-center space-x-2 text-slate-400 overflow-hidden">
                    <Globe size={14} className={isDev ? 'text-red-400 flex-shrink-0' : 'text-blue-400 flex-shrink-0'} />
                    <span className="text-xs font-medium tracking-wide text-slate-400 truncate max-w-[150px]">
                      {site.url || site.name || 'LINK'}
                    </span>
                  </div>
                  
                  <div className="flex items-center gap-2">
                    {site.subtitle && (
                      <span className={`inline-flex items-center gap-1 text-[11px] font-semibold px-2 py-0.5 rounded-full border max-w-[150px] truncate ${
                        isDev 
                          ? 'bg-red-500/15 text-red-400 border-red-500/30' 
                          : 'bg-blue-500/10 text-blue-400 border-blue-500/20'
                      }`}>
                        <Tag size={10} />
                        <span className="truncate">{site.subtitle}</span>
                      </span>
                    )}
                    <ExternalLink size={16} className="text-slate-500 group-hover:text-blue-400 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-all flex-shrink-0" />
                  </div>
                </div>

                <h3 className="text-lg font-bold text-slate-100 mb-2 leading-snug line-clamp-1 group-hover:text-blue-300 transition-colors">
                  {site.title}
                </h3>

                <p className="text-sm text-slate-400 leading-relaxed line-clamp-3 font-normal">
                  {site.description}
                </p>
              </div>

              {site.url && (
                <div className="mt-4 pt-3 border-t border-slate-800/60 flex items-center justify-between text-xs text-slate-500 group-hover:text-slate-400 transition-colors">
                  <span className="truncate max-w-[200px]">{site.url}</span>
                  <span className="text-blue-400/80 group-hover:text-blue-400 font-medium">방문하기 →</span>
                </div>
              )}
            </div>
          </div>
        );
      };

      // --- MAIN APP COMPONENT ---
      const App = () => {
        const [searchQuery, setSearchQuery] = useState('');
        const [sites, setSites] = useState([]);
        const [loading, setLoading] = useState(false);
        const [errorMessage, setErrorMessage] = useState(null);
        const [lastUpdated, setLastUpdated] = useState(null);

        const loadSites = useCallback(async (customUrl) => {
          const sheetUrl = (customUrl !== undefined ? customUrl : getSavedSheetUrl()).trim();
          
          if (!sheetUrl) {
            const cached = getCachedSites();
            setSites(cached);
            setErrorMessage(null);
            return;
          }

          setLoading(true);
          setErrorMessage(null);

          try {
            const fetchedSites = await fetchSitesFromGoogleSheet(sheetUrl);
            setSites(fetchedSites);
            setLastUpdated(new Date());
            setErrorMessage(null);
          } catch (err) {
            console.error('Failed to load sheet:', err);
            setErrorMessage(err?.message || '스프레드시트 데이터를 불러오지 못했습니다.');
            const cached = getCachedSites();
            if (cached.length > 0 && sites.length === 0) {
              setSites(cached);
            }
          } finally {
            setLoading(false);
          }
        }, [sites.length]);

        useEffect(() => {
          const cached = getCachedSites();
          if (cached.length > 0) {
            setSites(cached);
          }
          loadSites();
        }, []);

        const filteredSites = sites.filter(site => {
          const query = searchQuery.toLowerCase().trim();
          if (!query) return true;

          return (
            (site.title && site.title.toLowerCase().includes(query)) ||
            (site.subtitle && site.subtitle.toLowerCase().includes(query)) ||
            (site.description && site.description.toLowerCase().includes(query)) ||
            (site.name && site.name.toLowerCase().includes(query)) ||
            (site.url && site.url.toLowerCase().includes(query))
          );
        });

        return (
          <div className="min-h-screen bg-slate-950 text-white selection:bg-blue-500/30 flex flex-col">
            {/* Header */}
            <header className="sticky top-0 z-40 w-full border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-md supports-[backdrop-filter]:bg-slate-950/60">
              <div className="container mx-auto px-4 h-20 flex items-center justify-between gap-4">
                <div className="flex items-center gap-3 flex-shrink-0">
                  <h1 className="text-2xl md:text-3xl font-black tracking-tighter text-white bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-blue-400">
                    GAKBBUL
                  </h1>
                </div>

                {/* Search Bar */}
                <div className="flex-1 max-w-xl relative">
                  <div className="relative group">
                    <Search className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-blue-400 transition-colors" size={18} />
                    <input
                      type="text"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      placeholder="제목, 부제목, 설명, 사이트 검색..."
                      className="w-full bg-slate-900/60 border border-slate-800 rounded-xl py-2.5 pl-10 pr-4 text-sm text-slate-200 focus:outline-none focus:border-blue-500/60 focus:bg-slate-900 transition-all placeholder:text-slate-500"
                    />
                  </div>
                </div>

                {/* Header Buttons */}
                <div className="flex items-center gap-2">
                  <button
                    onClick={() => loadSites()}
                    disabled={loading}
                    title="데이터 새로고침"
                    className="p-2.5 text-slate-400 hover:text-white hover:bg-slate-800/80 rounded-xl border border-transparent hover:border-slate-700 transition-all"
                  >
                    <RefreshCw size={18} className={loading ? 'animate-spin text-blue-400' : ''} />
                  </button>

                  <a
                    href={DEFAULT_SHEET_URL}
                    target="_blank"
                    rel="noopener noreferrer"
                    title="구글 스프레드시트 열기"
                    className="p-2.5 text-slate-400 hover:text-emerald-400 hover:bg-slate-800/80 rounded-xl border border-transparent hover:border-slate-700 transition-all flex items-center justify-center"
                  >
                    <FileSpreadsheet size={18} />
                  </a>
                </div>
              </div>
            </header>

            {/* Main Content */}
            <main className="container mx-auto px-4 py-8 flex-1">
              {/* Error Banner */}
              {errorMessage && (
                <div className="mb-6 p-4 bg-red-500/10 border border-red-500/30 rounded-2xl flex items-start gap-3 text-red-300 text-sm">
                  <AlertCircle size={20} className="text-red-400 flex-shrink-0 mt-0.5" />
                  <div className="flex-1">
                    <div className="font-semibold text-red-200">스프레드시트 연동 알림</div>
                    <div className="text-xs text-red-300/90 mt-1">{errorMessage}</div>
                  </div>
                </div>
              )}

              {/* Empty state when no sites */}
              {sites.length === 0 && !loading && (
                <div className="flex flex-col items-center justify-center py-20 text-center max-w-md mx-auto">
                  <div className="w-16 h-16 bg-blue-500/10 border border-blue-500/20 rounded-2xl flex items-center justify-center mb-4 text-blue-400">
                    <Sparkles size={32} />
                  </div>
                  <h2 className="text-xl font-bold text-white mb-2">등록된 웹사이트가 없습니다</h2>
                  <p className="text-sm text-slate-400 mb-6 leading-relaxed">
                    구글 스프레드시트 링크가 기본 연동되었습니다.<br />
                    스프레드시트에 사이트를 추가하시면 이곳에 실시간으로 표시됩니다.
                  </p>
                  <a
                    href={DEFAULT_SHEET_URL}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="px-6 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl transition-all shadow-lg shadow-emerald-600/20 flex items-center gap-2 text-sm"
                  >
                    <FileSpreadsheet size={18} />
                    구글 스프레드시트 열기
                  </a>
                </div>
              )}

              {/* Search empty state */}
              {sites.length > 0 && filteredSites.length === 0 && (
                <div className="flex flex-col items-center justify-center py-20 text-slate-500">
                  <Search size={48} className="mb-4 opacity-20" />
                  <p className="text-lg text-slate-400">'{searchQuery}'에 대한 검색 결과가 없습니다.</p>
                  <button
                    onClick={() => setSearchQuery('')}
                    className="mt-3 text-xs text-blue-400 hover:underline"
                  >
                    검색어 초기화
                  </button>
                </div>
              )}

              {/* Cards Grid */}
              {filteredSites.length > 0 && (
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                  {filteredSites.map((site) => (
                    <SiteCard key={site.id} site={site} />
                  ))}
                </div>
              )}
            </main>

            {/* Footer */}
            <footer className="border-t border-slate-800/60 py-6 text-center text-xs text-slate-500">
              <div className="container mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
                <span>© GAKBBUL Dashboard</span>
                {lastUpdated && (
                  <span className="text-slate-600 text-[11px]">
                    마지막 동기화: {lastUpdated.toLocaleTimeString()}
                  </span>
                )}
              </div>
            </footer>
          </div>
        );
      };

      // --- MOUNT ---
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(
        <React.StrictMode>
          <App />
        </React.StrictMode>
      );
    </script>
  </body>
</html>
